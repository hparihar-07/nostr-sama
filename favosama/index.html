<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FavoSama | Immutable Vault</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              brutal: "6px 6px 0px 0px rgba(0,0,0,1)",
              "brutal-sm": "3px 3px 0px 0px rgba(0,0,0,1)",
              "brutal-active": "0px 0px 0px 0px rgba(0,0,0,1)",
            },
            colors: {
              "neo-lavender": "#c4b5fd",
              "neo-rose": "#fca5a5",
              "neo-mint": "#6ee7b7",
              "neo-lemon": "#fde047",
              "neo-bg": "#f8fafc",
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
        background-size: 24px 24px;
        font-family: monospace;
      }
    </style>
  </head>
  <body
    class="min-h-screen p-4 lg:p-8 text-black selection:bg-neo-lemon selection:text-black"
  >
    <main class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
      <aside class="w-full lg:w-1/3 flex flex-col gap-6">
        <div
          class="bg-neo-lavender border-4 border-black p-6 shadow-brutal relative"
        >
          <div
            class="absolute -top-3 -right-3 bg-neo-lemon border-4 border-black w-10 h-10 flex items-center justify-center font-black text-2xl shadow-brutal-sm"
          >
            🌟
          </div>
          <h1
            class="text-4xl sm:text-5xl font-black uppercase tracking-tighter text-white drop-shadow-[2px_2px_0px_rgba(0,0,0,1)]"
          >
            FavoSama
          </h1>
          <p
            class="font-bold text-black bg-white inline-block px-2 py-1 border-2 border-black mt-2 text-xs uppercase shadow-brutal-sm tracking-widest"
          >
            NIP-33 Media Vault
          </p>
        </div>

        <div
          class="bg-white border-4 border-black p-6 shadow-brutal flex flex-col gap-4"
        >
          <button
            id="connect-btn"
            class="w-full bg-neo-lemon text-black border-4 border-black px-4 py-3 font-black uppercase tracking-widest shadow-brutal-sm transition-all hover:bg-white active:translate-x-[4px] active:translate-y-[4px] active:shadow-brutal-active"
          >
            Connect Identity
          </button>
          <div
            id="status-badge"
            class="bg-black text-neo-lemon px-3 py-2 font-bold text-xs border-2 border-black text-center uppercase tracking-widest"
          >
            [ OFFLINE ]
          </div>
        </div>

        <div
          class="bg-white border-4 border-black p-6 shadow-brutal flex flex-col gap-4"
        >
          <h2 class="font-black uppercase text-xl border-b-4 border-black pb-2">
            Add to Collection
          </h2>

          <input
            type="text"
            id="anime-title"
            placeholder="Anime Title (e.g., Bleach)"
            class="w-full bg-neo-bg border-4 border-black px-4 py-3 font-bold outline-none focus:bg-white transition-colors shadow-inner placeholder-gray-400"
          />

          <input
            type="text"
            id="anime-image"
            placeholder="Image URL (https://...)"
            class="w-full bg-neo-bg border-4 border-black px-4 py-3 font-bold outline-none focus:bg-white transition-colors shadow-inner placeholder-gray-400 text-sm"
          />

          <div class="flex flex-col gap-2 mt-2">
            <label class="font-black uppercase text-sm">Rating:</label>
            <select
              id="anime-rating"
              class="flex-1 border-4 border-black px-3 py-3 font-bold outline-none cursor-pointer bg-white shadow-brutal-sm focus:bg-neo-lavender transition-colors"
            >
              <option value="Masterpiece 🌟">Masterpiece 🌟</option>
              <option value="Great 👍">Great 👍</option>
              <option value="Good 🙂">Good 🙂</option>
              <option value="Mid 😐">Mid 😐</option>
            </select>
          </div>

          <button
            id="save-btn"
            class="w-full bg-neo-mint text-black border-4 border-black px-4 py-4 font-black uppercase tracking-widest shadow-brutal-sm transition-all hover:bg-white active:translate-x-[4px] active:translate-y-[4px] active:shadow-brutal-active mt-2 text-lg"
          >
            Sync to Network
          </button>
        </div>
      </aside>

      <section class="w-full lg:w-2/3">
        <div
          class="bg-white border-4 border-black p-6 shadow-brutal min-h-[650px] flex flex-col"
        >
          <div
            class="flex justify-between items-center border-b-4 border-black pb-4 mb-6"
          >
            <h2 class="text-3xl font-black uppercase tracking-widest">
              Your Collection
            </h2>
            <span
              id="vault-count"
              class="bg-black text-white px-4 py-1 font-black text-xl border-2 border-black shadow-brutal-sm"
              >0</span
            >
          </div>

          <div
            id="vault-grid"
            class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"
          >
            <div
              id="empty-state"
              class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400"
            >
              <span class="text-6xl mb-4 grayscale opacity-40">🗄️</span>
              <p class="font-bold uppercase tracking-widest text-black/50">
                Vault is empty.
              </p>
              <p class="text-xs mt-2 font-bold text-black/40">
                Connect identity to fetch records.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
