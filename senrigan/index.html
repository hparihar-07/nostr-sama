<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senrigan | Nostr Explorer</title>
    <script>
      console.warn = () => {};
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
    <style>
      body {
        font-family: "Space Grotesk", sans-serif;
        background-color: #ffffff;
      }
      h1,
      button {
        font-family: "Archivo Black", sans-serif;
      }

      .neo-brutal-shadow {
        box-shadow: 12px 12px 0px 0px #000;
      }
      .neo-button-shadow {
        box-shadow: 6px 6px 0px 0px #000;
      }

      .neo-button-shadow:active {
        box-shadow: 0px 0px 0px 0px #000;
        transform: translate(6px, 6px);
      }

      .grid-bg {
        background-image:
          linear-gradient(#e5e5e5 1px, transparent 1px),
          linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
        background-size: 40px 40px;
      }
    </style>
  </head>
  <body class="grid-bg min-h-screen p-4 md:p-16 flex flex-col items-center">
    <header
      class="w-full max-w-4xl flex flex-col md:flex-row items-end justify-between mb-12 gap-6"
    >
      <div
        class="bg-[#00F5FF] border-[6px] border-black p-6 md:p-8 neo-brutal-shadow -rotate-1"
      >
        <h1
          class="text-5xl md:text-8xl font-black uppercase italic tracking-tighter leading-none text-black"
        >
          SENRIGAN
        </h1>

        <div
          class="bg-black text-[#00F5FF] px-3 py-1 inline-block mt-4 font-bold text-xs md:text-sm tracking-widest uppercase"
        >
          Searching profiles on the Nostr network
        </div>
      </div>

      <div class="max-w-xs text-right hidden md:block">
        <p
          class="font-bold text-xl leading-tight uppercase border-r-8 border-[#BF00FF] pr-4"
        >
          Revealing identities across
          <span class="bg-black text-white px-1 italic"
            >Decentralized Relays</span
          >.
        </p>
      </div>
    </header>

    <main class="w-full max-w-2xl">
      <div
        class="bg-white border-[6px] border-black p-3 md:p-2 neo-brutal-shadow flex flex-col md:flex-row gap-4 md:gap-0"
      >
        <input
          type="text"
          id="pubkey-input"
          placeholder="Paste npub1... here"
          class="flex-1 bg-white border-[4px] md:border-0 md:border-r-[6px] border-black p-5 text-xl font-bold focus:outline-none placeholder-gray-300"
        />
        <button
          id="search-btn"
          class="bg-[#BF00FF] text-white px-10 py-5 md:py-0 border-[4px] md:border-0 border-black font-black uppercase text-xl neo-button-shadow md:shadow-none transition-all hover:bg-[#FFFF33] hover:text-black"
        >
          Search
        </button>
      </div>

      <div class="mt-8 flex flex-col items-center gap-4">
        <div class="flex items-center gap-3">
          <span class="w-3 h-3 bg-[#BF00FF] rounded-full animate-ping"></span>
          <p
            class="font-black uppercase tracking-widest text-black text-xs md:text-sm"
          >
            Scanning Global Relays...
          </p>
        </div>

        <p
          class="text-[10px] md:text-xs font-bold text-gray-500 uppercase tracking-tighter text-center max-w-md"
        >
          Connecting to wss://relay.damus.io, wss://nos.lol, and other
          decentralized nodes to retrieve profile metadata.
        </p>
      </div>

      <div
        id="profile-card"
        class="hidden mt-12 w-full bg-white border-[6px] border-black p-8 neo-brutal-shadow relative"
      ></div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
