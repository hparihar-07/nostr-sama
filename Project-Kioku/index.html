<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📜 Kioku | Decentralized Pastebin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: { 
                        'brutal': '6px 6px 0px 0px rgba(0,0,0,1)',
                        'brutal-sm': '3px 3px 0px 0px rgba(0,0,0,1)',
                        'brutal-active': '0px 0px 0px 0px rgba(0,0,0,1)'
                    },
                    colors: { 
                        'neo-lavender': '#c4b5fd',
                        'neo-mint': '#6ee7b7', 
                        'neo-peach': '#fdba74', 
                        'neo-lemon': '#fde047',  
                        'neo-bg': '#f8fafc',  
                        'editor-bg': '#1e293b'     
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #f8fafc; 
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px); 
            background-size: 24px 24px; 
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        /* Custom scrollbar for the dark code editor */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-left: 2px solid black; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-left: 2px solid black; border-radius: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 sm:px-8 font-mono text-black selection:bg-neo-lemon selection:text-black">

    <main class="w-full max-w-4xl bg-white border-4 border-black p-6 sm:p-10 shadow-brutal relative flex flex-col gap-6">
        
        <header class="border-b-4 border-black pb-6 mb-2 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 relative z-10">
            <div>
                <h1 class="text-4xl sm:text-5xl font-black tracking-tight mb-2">Kioku Pastebin</h1>
                <p class="font-bold text-black bg-neo-lemon inline-block px-3 py-1 border-2 border-black shadow-brutal-sm text-sm">Decentralized Code Sharing</p>
            </div>
            
            <div class="flex flex-col items-end gap-3 w-full sm:w-auto">
                <button id="connect-btn" class="w-full sm:w-auto bg-neo-lavender text-black border-4 border-black px-4 py-2 font-bold shadow-brutal-sm transition-all hover:bg-white active:translate-y-1 active:shadow-none">
                    🔌 Connect Wallet
                </button>
                <div id="status-badge" class="bg-white text-gray-500 px-4 py-1 font-bold text-xs border-2 border-black text-center w-full sm:w-auto">
                    Status: Standby
                </div>
            </div>
        </header>

        <div class="flex flex-col sm:flex-row gap-4">
            <input type="text" id="snippet-title" placeholder="Snippet Title (e.g., Auth Middleware)" 
                class="flex-1 border-4 border-black px-4 py-3 font-bold text-lg outline-none focus:bg-neo-lemon/20 transition-colors shadow-inner placeholder-gray-400">
            
            <select id="language-select" class="border-4 border-black px-4 py-3 font-bold text-lg outline-none cursor-pointer bg-white shadow-brutal-sm focus:bg-neo-lavender transition-colors appearance-none text-center sm:w-48">
                <option value="text/plain">Plain Text</option>
                <option value="application/javascript">JavaScript</option>
                <option value="text/x-python">Python</option>
                <option value="text/html">HTML</option>
                <option value="text/css">CSS</option>
                <option value="text/x-c++src">C++</option>
            </select>
        </div>

        <div class="relative w-full shadow-brutal">
            <div class="absolute top-0 left-0 bg-neo-peach text-black border-b-4 border-r-4 border-black px-3 py-1 text-xs font-bold uppercase z-10">
                Source Code
            </div>
            <textarea id="code-editor" spellcheck="false" placeholder="// Write your code here..." 
                class="w-full h-80 bg-editor-bg text-gray-100 border-4 border-black p-6 pt-10 font-mono text-sm sm:text-base outline-none focus:ring-4 focus:ring-neo-lavender/50 transition-all resize-y leading-relaxed whitespace-pre placeholder-gray-600"></textarea>
        </div>

        <button id="publish-btn" class="w-full bg-neo-mint text-black border-4 border-black px-6 py-4 font-black text-xl shadow-brutal transition-all hover:bg-white active:translate-x-[6px] active:translate-y-[6px] active:shadow-brutal-active tracking-wide">
            Publish Snippet
        </button>

        <div id="result-panel" class="hidden flex-col gap-4 mt-4 p-6 bg-neo-lavender/30 border-4 border-black shadow-brutal animate-pop">
            <div class="flex items-center gap-3">
                <span class="bg-neo-mint border-2 border-black w-8 h-8 flex items-center justify-center rounded-full text-xl shadow-brutal-sm">✓</span>
                <h3 class="text-xl font-black text-black">Published Successfully</h3>
            </div>
            
            <div class="flex flex-col gap-2">
                <span class="text-xs font-bold uppercase bg-black text-white inline-block px-2 py-1 self-start">Share Link</span>
                <div class="flex gap-2">
                    <input type="text" id="share-link" readonly class="flex-1 bg-white border-4 border-black px-3 py-2 font-mono text-sm outline-none truncate selection:bg-neo-lemon selection:text-black">
                    <button id="copy-btn" class="bg-neo-lemon border-4 border-black px-4 font-bold hover:bg-white active:translate-y-1 transition-transform shadow-brutal-sm">
                        Copy
                    </button>
                </div>
            </div>
        </div>

    </main>

    <style>
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.98) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>

    <script type="module" src="app.js"></script>
</body>
</html>
