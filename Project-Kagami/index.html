<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🪞 Project Kagami | Elegant Verification</title>
    <script>
      console.warn = () => {};
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              brutal: "6px 6px 0px 0px rgba(0,0,0,1)",
              "brutal-lg": "12px 12px 0px 0px rgba(0,0,0,1)",
            },
            colors: {
              "neo-purple": "#b28dff",
              "neo-yellow": "#ffeb3b",
              "neo-cyan": "#00ffff",
              "neo-green": "#39ff14",
              "neo-red": "#ff3860",
              "neo-bg": "#f3f4f6",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #f3f4f6;
        background-image: radial-gradient(#d1d5db 2px, transparent 2px);
        background-size: 30px 30px;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: white;
        border-left: 2px solid black;
      }
      ::-webkit-scrollbar-thumb {
        background: black;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center p-4 lg:p-8 font-mono text-black"
  >
    <main
      class="w-full max-w-5xl bg-neo-purple border-4 border-black p-6 lg:p-10 shadow-brutal-lg relative flex flex-col lg:flex-row gap-8 lg:gap-12 overflow-hidden selection:bg-neo-pink"
    >
      <div
        class="absolute -top-4 left-1/2 -translate-x-1/2 w-32 h-8 bg-neo-yellow border-4 border-black opacity-90 transform -rotate-2 z-20"
      ></div>

      <div class="w-full lg:w-1/2 flex flex-col justify-center relative z-10">
        <header class="mb-8 text-center lg:text-left">
          <h1
            class="text-4xl sm:text-6xl font-black uppercase tracking-widest mb-2 text-white"
            style="-webkit-text-stroke: 2px black"
          >
            🪞 Kagami
          </h1>
          <p
            class="font-bold text-black bg-white inline-block px-3 py-1 border-2 border-black shadow-[2px_2px_0px_rgba(0,0,0,1)]"
          >
            NIP-05 Identity Verifier
          </p>
        </header>

        <div class="flex flex-col gap-5 mb-6">
          <input
            type="text"
            id="nip05-input"
            placeholder="e.g., sensei@domain.io"
            autocomplete="off"
            class="w-full border-4 border-black px-5 py-4 font-bold text-xl outline-none focus:bg-neo-cyan transition-colors shadow-inner placeholder-gray-600 text-center lg:text-left selection:bg-black selection:text-white"
          />

          <button
            id="verify-btn"
            class="w-full bg-neo-yellow text-black border-4 border-black px-6 py-4 font-black uppercase text-xl shadow-brutal transition-all hover:bg-white active:translate-x-[6px] active:translate-y-[6px] active:shadow-none tracking-wide"
          >
            Reflect Truth
          </button>
        </div>

        <div
          id="status-console"
          class="text-center font-bold text-sm h-12 flex items-center justify-center bg-black text-neo-cyan border-4 border-black px-4 overflow-hidden tracking-widest uppercase selection:bg-neo-pink"
        >
          [ SYSTEM ACTIVE: AWAITING IDENTIFIER ]
        </div>
      </div>

      <div
        class="w-full lg:w-1/2 flex items-stretch justify-center min-h-[480px]"
      >
        <div
          id="placeholder-card"
          class="w-full border-4 border-dashed border-black/40 bg-black/5 flex flex-col items-center justify-center p-8 text-center transition-all h-full"
        >
          <span class="text-6xl mb-4 opacity-30 grayscale filter">🪞</span>
          <p class="font-bold text-black/50 uppercase tracking-widest">
            Peering into the Infinite Void...
          </p>
        </div>

        <div
          id="verified-card"
          class="hidden w-full bg-white border-4 border-black shadow-brutal relative flex flex-col transition-all animate-pop overflow-hidden selection:bg-neo-pink h-full"
        >
          <div
            class="absolute -top-5 -right-5 bg-neo-green border-4 border-black w-14 h-14 flex items-center justify-center rounded-full shadow-brutal text-3xl transform rotate-12 z-20"
            title="Cryptographically Verified"
          >
            ✓
          </div>

          <div
            class="bg-neo-cyan border-b-4 border-black p-6 flex flex-col sm:flex-row items-center sm:items-start gap-5 relative z-10 shadow-[0_4px_0px_rgba(0,0,0,1)]"
          >
            <img
              id="card-image"
              src=""
              alt="Profile"
              class="w-24 h-24 border-4 border-black object-cover shadow-[4px_4px_0px_rgba(0,0,0,1)] bg-white shrink-0 selection:bg-black selection:text-white"
            />
            <div class="flex-1 text-center sm:text-left w-full overflow-hidden">
              <h2
                id="card-name"
                class="text-2xl sm:text-3xl font-black uppercase leading-none mb-3 truncate"
              >
                Name
              </h2>
              <p
                id="card-nip05"
                class="text-neo-green font-bold text-sm bg-black px-3 py-1 inline-block border-2 border-black truncate max-w-full"
              >
                user@domain.com
              </p>
            </div>
          </div>

          <div class="p-6 flex-1 flex flex-col bg-neo-bg gap-5 relative z-0">
            <div class="flex flex-col flex-1">
              <span
                class="text-xs font-black text-black uppercase bg-neo-yellow inline-block px-2 py-1 border-2 border-black border-b-0 self-start"
                >Kagami Approved Biography</span
              >
              <div
                id="card-about"
                class="text-sm font-bold leading-relaxed bg-white border-4 border-black p-4 flex-1 overflow-y-auto max-h-[140px] shadow-inner selection:bg-black selection:text-white"
              >
                Bio goes here...
              </div>
            </div>

            <div class="flex flex-col mt-auto">
              <span
                class="text-xs font-black text-black uppercase bg-neo-green inline-block px-2 py-1 border-2 border-black border-b-0 self-start"
                >Human-Readable ID (npub)</span
              >
              <div
                id="card-npub"
                class="text-[10px] sm:text-xs font-bold break-all bg-black text-white p-3 border-4 border-black selection:bg-neo-cyan font-mono tracking-wide"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <style>
      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.9) translateY(20px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .animate-pop {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
    </style>

    <script type="module" src="app.js"></script>
  </body>
</html>
