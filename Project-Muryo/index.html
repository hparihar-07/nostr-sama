<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>♾️ Muryo | The Infinite Void</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: {
              brutal: "6px 6px 0px 0px rgba(0,  0, 0, 1)",
              "brutal-hover": "2px 2px 0px 0px rgba(0, 0, 0, 1)",
            },
            colors: {
              "brutal-yellow": "#fde047",
              "brutal-blue": "#93c5fd",
              "brutal-green": "#86efac",
              "brutal-pink": "#f9a8d4",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-image: radial-gradient(#94a3b8, transparent 2px);
        background-size: 24px 24px;
        background-color: #f8fafc;
      }
      @keyframes popIn {
        0% {
          opacity: 0;
          transform: translateY(-20px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-pop {
        animation: popIn 0.25 cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
    </style>
  </head>
  <body class="p-4 md:p-8 font-mono text-black">
    <header
      class="max-w-7xl mx-auto mb-8 flex flex-col xl:flex-row justify-between items-center gap-4 bg-white border-4 border-black p-6 shadow-brutal"
    >
      <div class="w-full xl:w-auto text-center xl:text-left">
        <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tighter">
          ♾️ Project Muryo
        </h1>
        <p id="relay-status" class="font-bold mt-2 text-gray-700">
          Awaiting Target Coordination...
        </p>
      </div>

      <div
        class="flex flex-col md:flex-row w-full xl:w-auto gap-4 items-center"
      >
        <input
          type="text"
          id="relay-input"
          value="wss://relay.damus.io"
          placeholder="wss://..."
          class="w-full md:w-64 border-4 border-black px-4 py-3 font-bold outline-none focus:bg-brutal-blue/30 transition-colors"
        />

        <button
          id="btn-toggle"
          class="w-full md:w-auto bg-brutal-green border-4 border-black px-6 py-3 font-bold uppercase shadow-brutal transition-all hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-brutal-hover active:translate-x-[6px] active:translate-y-[6px] active:shadow-none whitespace-nowrap"
        >
          Start Stream
        </button>
        <div
          class="bg-white border-4 border-black px-6 py-3 font-bold shadow-brutal flex items-center gap-2 whitespace-nowrap"
        >
          Events: <span id="counter" class="text-2xl text-red-500">0</span>
        </div>
      </div>
    </header>
    <div
      id="filters"
      class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row items-start md:items-center gap-4"
    >
      <span
        class="font-black uppercase tracking-widest text-sm bg-black text-white px-3 py-1"
        >Filters</span
      >
      <div class="flex flex-wrap gap-3 font-bold text-sm uppercase">
        <button
          data-kind="1"
          class="filter-btn active bg-brutal-yellow border-2 border-black px-3 py-1 shadow-brutal transition-all hover:-translate-y-1"
        >
          📝 Note (1)
        </button>
        <button
          data-kind="0"
          class="filter-btn active bg-brutal-blue border-2 border-black px-3 py-1 shadow-brutal transition-all hover:-translate-y-1"
        >
          👤 Profile (0)
        </button>
        <button
          data-kind="3"
          class="filter-btn active bg-brutal-green border-2 border-black px-3 py-1 shadow-brutal transition-all hover:-translate-y-1"
        >
          🤝 Contact (3)
        </button>
        <button
          data-kind="7"
          class="filter-btn active bg-brutal-pink border-2 border-black px-3 py-1 shadow-brutal transition-all hover:-translate-y-1"
        >
          ❤️ React (7)
        </button>
        <button
          data-kind="other"
          class="filter-btn active bg-white border-2 border-black px-3 py-1 shadow-brutal transition-all hover:-translate-y-1"
        >
          ✨ Other
        </button>
      </div>
    </div>
    <main
      id="firehose-grid"
      class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 items-start"
    ></main>
    <script src="app.js" type="module"></script>
  </body>
</html>
